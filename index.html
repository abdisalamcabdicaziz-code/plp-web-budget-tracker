<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise Dashboard - Interactive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h2>SpendWise</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" tabindex="0">Dashboard</a>
                <a href="#" class="nav-item" tabindex="0">Expenses</a>
                <a href="#" class="nav-item" tabindex="0">Categories</a>
                <a href="#" class="nav-item" tabindex="0">Analytics</a>
                <a href="#" class="nav-item" tabindex="0">Settings</a>
            </nav>
        </aside>
        <main class="main-content">
            <header class="dashboard-header">
                <div class="header-title">
                    <h1>Dashboard Overview</h1>
                    <p>Welcome back, <span id="display-username">MAANAF 7</span>! Manage your budget interactively.</p>
                </div>
                <div class="header-profile">
                    <span class="user-name">MAANAF 7</span>
                    <div class="avatar">M</div>
                </div>
            </header>

            <section class="summary-section" style="margin-bottom: 2rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
                <div class="card" style="padding: 1.5rem; background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
                    <h3>Total Budget</h3>
                    <p id="summary-budget" class="amount" style="font-size: 1.8rem; font-weight: 700; color: #2563eb;">$2500.00</p>
                </div>
                <div class="card" style="padding: 1.5rem; background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
                    <h3>Total Expenses</h3>
                    <p id="summary-spent" class="amount" style="font-size: 1.8rem; font-weight: 700; color: #dc2626;">$0.00</p>
                </div>
                <div class="card" style="padding: 1.5rem; background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
                    <h3>Remaining Balance</h3>
                    <p id="summary-balance" class="amount" style="font-size: 1.8rem; font-weight: 700; color: #16a34a;">$0.00</p>
                </div>
            </section>

            <section class="interaction-section" style="background: white; padding: 1.5rem; border-radius: 12px; margin-bottom: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
                <h3>Add New Expense</h3>
                <form id="expense-form" style="display: flex; gap: 1rem; margin-top: 1rem; flex-wrap: wrap;">
                    <input type="text" id="expense-name" placeholder="Expense Name (e.g., Coffee)" required style="padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 8px; flex: 2; min-width: 200px;">
                    <input type="number" id="expense-amount" placeholder="Amount ($)" step="0.01" required style="padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 8px; flex: 1; min-width: 120px;">
                    <button type="submit" style="padding: 0.75rem 1.5rem; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">Add Expense</button>
                </form>
                <div id="budget-alert" style="margin-top: 1rem; padding: 0.75rem; border-radius: 8px; font-weight: 500; display: none;"></div>
            </section>

            <section class="cards-grid" id="expenses-container">
            </section>
        </main>
    </div>
</body>
</html>
